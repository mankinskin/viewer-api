<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">viewer-api package surface</title>
  <desc id="desc">Diagram showing viewer-api, viewer-ctl, and viewer-api-dioxus as the main packages in the viewer-api repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fafc" />
      <stop offset="100%" stop-color="#edf3f8" />
    </linearGradient>
    <style>
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #17324f; }
      .text { font: 500 18px 'Segoe UI', sans-serif; fill: #17324f; }
      .small { font: 500 16px 'Segoe UI', sans-serif; fill: #3b5872; }
      .box { fill: #ffffff; stroke: #7fa4c7; stroke-width: 2; rx: 18; }
      .accent { fill: #e2f2e8; stroke: #6ea58a; stroke-width: 2; rx: 18; }
      .config { fill: #fff2db; stroke: #d2a55d; stroke-width: 2; rx: 18; }
      .line { stroke: #5e7c96; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5e7c96" />
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)" />
  <text x="80" y="78" class="title">viewer-api repository surface</text>
  <text x="80" y="114" class="text">Shared server runtime, lifecycle control, and browser UI scaffolding for viewer tools.</text>

  <rect x="90" y="180" width="280" height="140" class="config" />
  <text x="130" y="236" class="title">viewer-ctl.toml</text>
  <text x="130" y="272" class="text">Central component registry</text>
  <text x="130" y="302" class="small">Declares servers, frontends, tasks, ports, and asset wiring.</text>

  <rect x="470" y="120" width="320" height="170" class="box" />
  <text x="520" y="182" class="title">viewer-ctl</text>
  <text x="520" y="218" class="text">Lifecycle manager CLI</text>
  <text x="520" y="248" class="small">Lists, builds, installs, prepares, starts, and stops viewer components.</text>

  <rect x="470" y="390" width="320" height="170" class="accent" />
  <text x="520" y="452" class="title">viewer-api</text>
  <text x="520" y="488" class="text">Shared HTTP and MCP runtime</text>
  <text x="520" y="518" class="small">Provides auth, middleware, pagination, sessions, SSE, static files, and tracing.</text>

  <rect x="890" y="250" width="320" height="180" class="box" />
  <text x="930" y="314" class="title">viewer-api-dioxus</text>
  <text x="930" y="350" class="text">Browser UI scaffold</text>
  <text x="930" y="380" class="small">Root app, WebGPU canvas, overlay shell, and shared Dioxus viewer components.</text>

  <path d="M370 250 L470 205" class="line" marker-end="url(#arrow)" />
  <path d="M370 250 L470 455" class="line" marker-end="url(#arrow)" />
  <path d="M790 205 L890 300" class="line" marker-end="url(#arrow)" />
  <path d="M790 475 L890 380" class="line" marker-end="url(#arrow)" />

  <text x="80" y="650" class="small">Concrete viewers such as ticket-viewer and spec-viewer reuse these packages for runtime wiring, frontend scaffolding, or both.</text>
</svg>