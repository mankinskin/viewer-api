imports:
- 20-readme-schemas.yaml

defaults:
  repo_scope: viewer-api
folders:
- name: viewer-api
  files:
  - name: README.md
    target:
      name: viewer-api-crate-readme
      path_scope: viewer-api/README.md
      schema: child-readme-v1
      target_kind: child
      nodes:
      - name: parent-readme
        title: Parent README
        section: packages/viewer-api/parent-readme
      - name: onboarding
        section: packages/viewer-api/readme
  folders:
  - name: frontend
    folders:
    - name: dioxus
      files:
      - name: README.md
        target:
          name: viewer-api-dioxus-readme
          path_scope: viewer-api/frontend/dioxus/README.md
          schema: child-readme-v1
          target_kind: child
          nodes:
          - name: parent-readme
            title: Parent README
            section: packages/viewer-api-dioxus/parent-readme
          - name: onboarding
            section: packages/viewer-api-dioxus/readme