imports:
- 20-readme-schemas.yaml

defaults:
  repo_scope: viewer-api
folders:
- name: viewer-ctl
  files:
  - name: README.md
    target:
      name: viewer-ctl-readme
      path_scope: viewer-ctl/README.md
      schema: child-readme-v1
      target_kind: child
      nodes:
      - name: parent-readme
        title: Parent README
        section: packages/viewer-ctl/parent-readme
      - name: onboarding
        section: tools/viewer-ctl/readme
